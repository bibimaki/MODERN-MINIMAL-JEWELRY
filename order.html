<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AVÉN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">AVÉN</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="product.html">Shop</a>
      <a href="product.html?category=rings">Rings</a>
      <a href="product.html?category=necklaces">Necklaces</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="nav-right">
      <a href="order.html" class="bag-btn active">Bag <span class="bag-count" data-bag-count>0</span></a>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="page-head wrap">
  <div class="small-label">CHECKOUT</div>
  <h1 class="display-2" style="margin-top:10px;">Your Bag</h1>
</div>

<div class="wrap checkout-layout">
  <div>
    <form id="checkout-form" novalidate>
      <h2 class="display-3" style="margin-bottom:24px;">Shipping Details</h2>

      <div class="field-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required placeholder="Your full name">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@email.com">
        </div>
        <div class="field-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" required placeholder="08X-XXX-XXXX">
        </div>
      </div>

      <div class="field-group">
        <label for="address">Shipping Address</label>
        <textarea id="address" name="address" rows="3" required placeholder="House no., street, district, province, postal code"></textarea>
      </div>

      <h2 class="display-3" style="margin:36px 0 20px;">Payment Method</h2>
      <div class="pay-options">
        <label class="pay-option selected">
          <input type="radio" name="payment" value="PromptPay" checked>
          <div>
            <div class="pay-name">PromptPay</div>
            <div class="pay-sub">Scan QR after placing your order</div>
          </div>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="Bank Transfer">
          <div>
            <div class="pay-name">Bank Transfer</div>
            <div class="pay-sub">Details sent to your email</div>
          </div>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="Cash on Delivery">
          <div>
            <div class="pay-name">Cash on Delivery</div>
            <div class="pay-sub">Pay when your piece arrives</div>
          </div>
        </label>
      </div>

      <button type="submit" id="place-order" class="btn btn-dark btn-full mt-64" style="margin-top:36px;">Place Order</button>
    </form>
  </div>

  <aside class="bag-summary">
    <h2 class="display-3" style="margin-bottom:20px;">Order Summary</h2>
    <div id="bag-summary-lines"></div>
    <div id="summary-totals">
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="sum-subtotal">฿0</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span id="sum-shipping">Free</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="sum-total">฿0</span>
      </div>
    </div>
  </aside>
</div>

<script src="script.js"></script>
</body>
</html>
